<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: iPhoneのノッチ部分まで背景を広げる（中身は safe-area で避ける） -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ピアノ スタンプカード</title>

<!-- ▼ ホーム画面に追加したとき「アプリっぽく」全画面で開くための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スタンプ">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a1a5e">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   ベース
   ========================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;          /* 引っぱってバウンドするのを防ぐ */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;        /* 長押しメニューを出さない */
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;         /* ダブルタップズームを無効化 */
  background: #1a0f45;
}
button { font: inherit; cursor: pointer; }

/* =========================================================
   背景（2枚を重ねて、スワイプ量に合わせてクロスフェード）
   ========================================================= */
.bg { position: fixed; inset: 0; overflow: hidden; }
.bg-night {
  background:
    radial-gradient(ellipse 120% 70% at 50% 0%, #6a48c9 0%, #3a1f86 45%, #1a0f45 100%);
}
.moon {
  position: absolute; top: calc(env(safe-area-inset-top) + 70px); right: 8%;
  width: 70px; height: 70px; border-radius: 50%;
  box-shadow: 16px -6px 0 0 #fff3b0;   /* 影で三日月をつくる */
  filter: drop-shadow(0 0 18px rgba(255,240,160,.6));
  transform: rotate(-20deg);
}
.star {
  position: absolute; width: var(--s); height: var(--s); border-radius: 50%;
  background: #fff; box-shadow: 0 0 6px #fff;
  animation: twinkle ease-in-out infinite;
}
@keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.2); } }
.shooting {
  position: absolute; top: 15%; left: -20%; width: 120px; height: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
  border-radius: 2px; transform: rotate(18deg);
  animation: shoot 7s ease-in infinite;
}
@keyframes shoot {
  0%, 82% { transform: translate(0,0) rotate(18deg); opacity: 0; }
  85% { opacity: 1; }
  100% { transform: translate(140vw, 45vw) rotate(18deg); opacity: 0; }
}

.bg-pink {
  opacity: 0;   /* JSでスクロール量に応じて 0→1 に変える */
  background: linear-gradient(180deg, #ffd9ea 0%, #ffe9f1 50%, #fff1d9 100%);
}
.paw {
  position: absolute; bottom: -60px; opacity: .22;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  from { transform: translateY(0) rotate(var(--rot)); }
  to   { transform: translateY(-120vh) rotate(calc(var(--rot) + 40deg)); }
}

/* =========================================================
   上部タブ
   ========================================================= */
.tabs {
  position: fixed; z-index: 5;
  top: calc(env(safe-area-inset-top) + 12px); left: 50%; transform: translateX(-50%);
  width: min(92vw, 360px);
  display: flex; padding: 5px; border-radius: 999px;
  background: rgba(255,255,255,.85);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 6px 20px rgba(0,0,0,.15);
}
.tabs button {
  flex: 1; position: relative; z-index: 1;
  border: 0; background: none; padding: 10px 6px; border-radius: 999px;
  font-weight: 800; font-size: 14px; color: #a28aaf; transition: color .3s;
  white-space: nowrap;
}
.tabs button.active { color: #4a2196; }
.tab-indicator {
  position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc(50% - 5px);
  border-radius: 999px; background: #fff;
  box-shadow: 0 2px 8px rgba(74,33,150,.2);
  transform: translateX(calc(var(--p, 0) * 100%));
}

/* =========================================================
   ページ（横スワイプで切り替え：scroll-snap）
   ========================================================= */
.pages {
  position: fixed; inset: 0; z-index: 1;
  display: flex; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; scrollbar-width: none;
}
.pages::-webkit-scrollbar { display: none; }
.page {
  flex: 0 0 100%; height: 100%;
  scroll-snap-align: center; scroll-snap-stop: always;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  padding: calc(env(safe-area-inset-top) + 78px) 18px calc(env(safe-area-inset-bottom) + 14px);
}
.card, .actions { width: 100%; max-width: 440px; }

/* テーマごとの色（CSS変数で切り替え） */
.night { --accent: #ffd23f; --glow: rgba(255,210,63,.55); --edge: #c98a00; --ring: #ffe27a; }
.pink  { --accent: #ff5c93; --glow: rgba(255,92,147,.5);  --edge: #d93d75; --ring: #ff8db5; }

/* =========================================================
   カード本体
   ========================================================= */
.card { position: relative; border-radius: 30px; padding: 20px 18px 16px; }
.night .card {
  background: linear-gradient(160deg, rgba(123,79,224,.38), rgba(40,20,90,.6));
  border: 2px solid rgba(255,210,63,.55);
  box-shadow: 0 0 34px rgba(255,210,63,.2), inset 0 0 30px rgba(255,255,255,.05);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.pink .card {
  background: #fff; border: 3px solid #ffc2d6; margin-top: 24px;
  box-shadow: 0 14px 30px rgba(255,92,147,.2);
}
/* ねこカードの耳 */
.pink .card::before, .pink .card::after {
  content: ""; position: absolute; top: -32px; width: 0; height: 0;
  border-left: 26px solid transparent; border-right: 26px solid transparent;
  border-bottom: 36px solid #ffc2d6;
}
.pink .card::before { left: 34px; transform: rotate(-12deg); }
.pink .card::after  { right: 34px; transform: rotate(12deg); }

.card.thump { animation: thump .45s ease-out; }
@keyframes thump {
  0% { transform: none; } 25% { transform: translateY(4px) scale(.985); }
  55% { transform: translateY(-2px) scale(1.01); } 100% { transform: none; }
}

.card-head { text-align: center; }
.sub { font-size: 12px; letter-spacing: .12em; opacity: .75; font-weight: 800; }
.night .sub { color: #e6dcff; }
.pink .sub { color: #e07aa0; }
h1 {
  font-size: clamp(24px, 7.4vw, 32px); font-weight: 800; line-height: 1.3;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.night h1 { color: #ffe27a; text-shadow: 0 0 14px rgba(255,210,63,.6); }
.pink h1 { color: #ff5c93; }
.head-icon { display: inline-block; font-size: 1.1em; }
.night .head-icon { animation: floaty 2.6s ease-in-out infinite; }
.pink .head-icon { animation: wiggle 1.8s ease-in-out infinite; }
@keyframes floaty { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-6px) rotate(6deg); } }
@keyframes wiggle { 0%,60%,100% { transform: rotate(0); } 70% { transform: rotate(-14deg); } 80% { transform: rotate(14deg); } 90% { transform: rotate(-8deg); } }
.medals { min-height: 22px; font-size: 15px; font-weight: 800; margin-top: 2px; }
.night .medals { color: #ffe9a8; }
.pink .medals { color: #e07aa0; }

/* =========================================================
   スタンプ枠
   ========================================================= */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 14px 4px 4px; }
.slot, .goal {
  position: relative; aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center;
}
.night .slot { border: 3px dashed rgba(255,210,63,.45); background: rgba(255,255,255,.04); }
.pink  .slot { border: 3px dashed #f9a3c3; background: #fff5f9; }
.slot.filled { border-color: transparent; background: none; }
.num { font-size: clamp(22px, 7vw, 30px); font-weight: 800; opacity: .55; color: var(--accent); }

/* 次に押される枠を「ここだよ」と光らせる */
.slot.next::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%;
  animation: nextPulse 1.6s ease-out infinite;
}
@keyframes nextPulse {
  0%   { box-shadow: 0 0 0 0 var(--glow); }
  80%,100% { box-shadow: 0 0 0 14px rgba(0,0,0,0); }
}

/* 新しいカードのとき、枠がポンポン出てくる */
.pop { animation: popIn .55s cubic-bezier(.3,1.7,.5,1) both; animation-delay: calc(var(--i) * 80ms); }
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

/* =========================================================
   スタンプ
   ========================================================= */
.stamp {
  position: absolute; inset: 3%; border-radius: 50%; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transform: rotate(var(--r));
}
.night .stamp {
  background: radial-gradient(circle at 35% 30%, #8a5ff0, #4a2196 72%);
  border: 3px solid #ffd23f;
  box-shadow: inset 0 0 0 3px #4a2196, inset 0 0 0 5px rgba(255,210,63,.6),
              0 4px 14px rgba(0,0,0,.35), 0 0 18px rgba(255,210,63,.4);
}
.pink .stamp {
  background: radial-gradient(circle at 35% 30%, #ffa3c4, #ff5c93 72%);
  border: 3px solid #fff;
  box-shadow: inset 0 0 0 3px #ff5c93, inset 0 0 0 5px rgba(255,255,255,.7),
              0 5px 12px rgba(255,92,147,.45);
}
.stamp svg { width: 52%; height: auto; margin-top: -6%; }
.stamp-text { font-size: clamp(6.5px, 2vw, 9px); font-weight: 800; letter-spacing: -.03em; margin-top: 1%; white-space: nowrap; }
.night .stamp-text { color: #ffe27a; }
.pink .stamp-text { color: #fff; }
/* 夜カードのスタンプはキラッと光り続ける */
.night .stamp::before {
  content: "✦"; position: absolute; top: 8%; right: 16%;
  color: #fff6c4; font-size: 12px; animation: twinkle 2s ease-in-out infinite;
}

/* ▼ ポンッと押される動き。55%のところで「着地」 */
.stamp.land { animation: land .45s ease-out both; }
@keyframes land {
  0%   { transform: scale(1.15) rotate(var(--r)); }
  30%  { transform: scale(.8) rotate(var(--r)); }
  60%  { transform: scale(1.1) rotate(var(--r)); }
  100% { transform: scale(1) rotate(var(--r)); }
}
/* 着地後にツヤがシュッと流れる */
.stamp.land::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 35%, rgba(255,255,255,.75) 50%, transparent 65%);
  background-size: 250% 100%;
  animation: gloss .9s .15s ease-out both;
}
@keyframes gloss { from { background-position: 150% 0; } to { background-position: -100% 0; } }

/* 着地の瞬間に広がる輪 */
.ring {
  position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  border: 4px solid var(--ring);
  animation: ring .6s ease-out forwards;
}
@keyframes ring { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }

.date {
  position: absolute; right: -4px; bottom: -4px; z-index: 2;
  font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 10px;
  background: #fff; color: #8a6a9a; box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.slot.landing .date { animation: fadeIn .4s .3s both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* =========================================================
   ゴール枠
   ========================================================= */
.night .goal { background: rgba(255,210,63,.08); border: 3px solid rgba(255,210,63,.35); }
.pink  .goal { background: #fff0f6; border: 3px solid #ffc2d6; }
.gift {
  position: relative; z-index: 1; font-size: clamp(32px, 10.5vw, 46px);
  filter: grayscale(.7); opacity: .6; transition: filter .4s, opacity .4s;
}
.glabel { position: absolute; bottom: 7%; z-index: 1; font-size: 11px; font-weight: 800; color: var(--accent); }
.goal.done .gift { filter: none; opacity: 1; animation: bounce 1s ease-in-out infinite; }
.goal.done::before {   /* 後ろでくるくる回る光 */
  content: ""; position: absolute; inset: -22%; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,220,90,.75) 0 12deg, transparent 12deg 24deg);
  -webkit-mask: radial-gradient(circle, #000 25%, transparent 68%);
          mask: radial-gradient(circle, #000 25%, transparent 68%);
  animation: spin 8s linear infinite;
}
.goal.unlock { animation: unlock .6s cubic-bezier(.3,1.8,.5,1); }
@keyframes unlock { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
@keyframes bounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-7px) scale(1.08); } }
@keyframes spin { to { transform: rotate(360deg); } }

.msg { text-align: center; font-weight: 800; font-size: 17px; margin-top: 12px; min-height: 1.5em; }
.night .msg { color: #fff; }
.pink .msg { color: #c2456f; }

/* =========================================================
   ボタン
   ========================================================= */
.actions { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.play {
  width: 100%; height: 78px; border: 0; border-radius: 999px;
  font-size: 24px; font-weight: 800; letter-spacing: .04em;
  position: relative; overflow: hidden;
  box-shadow: 0 7px 0 var(--edge), 0 14px 26px var(--glow);
  transition: transform .08s, box-shadow .08s;
}
.night .play { background: linear-gradient(180deg, #ffe680, #ffbf1f); color: #4a2196; }
.pink  .play { background: linear-gradient(180deg, #ff9cc0, #ff5c93); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.12); }
.play:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--edge), 0 4px 10px var(--glow); }
.play::after {   /* ボタンに流れるツヤ */
  content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent);
  transform: skewX(-20deg); animation: shine 3.2s ease-in-out infinite;
}
@keyframes shine { 0% { left: -60%; } 55%, 100% { left: 130%; } }

.undo {
  border: 0; background: none; padding: 8px 14px; font-size: 13px; font-weight: 800;
  opacity: .55; border-radius: 999px; transition: all .2s;
}
.night .undo { color: #e6dcff; }
.pink .undo { color: #c2456f; }
.undo.armed { opacity: 1; background: rgba(255,255,255,.85); color: #d93d75; }
.undo.hidden { visibility: hidden; }

/* =========================================================
   おめでとう画面
   ========================================================= */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  background: rgba(20,10,40,.5);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.panel {
  width: min(86vw, 360px); padding: 28px 22px 24px; border-radius: 30px; text-align: center;
  background: #fff; transform: scale(.5); transition: transform .55s cubic-bezier(.3,1.7,.5,1);
}
.overlay.show .panel { transform: scale(1); }
.overlay[data-theme="night"] .panel { background: linear-gradient(170deg, #fff8dc, #fff); border: 4px solid #ffd23f; color: #4a2196; }
.overlay[data-theme="pink"]  .panel { background: linear-gradient(170deg, #ffe3ee, #fff); border: 4px solid #ff8db5; color: #c2456f; }
.medal { font-size: 88px; line-height: 1.1; display: inline-block; }
.overlay.show .medal { animation: medalSpin 1.3s ease-out; }
@keyframes medalSpin { from { transform: rotateY(1080deg) scale(.2); } to { transform: rotateY(0) scale(1); } }
.panel h2 { font-size: 32px; font-weight: 800; margin: 6px 0 8px; }
.panel p { font-size: 17px; font-weight: 800; line-height: 1.6; }
.ov-btn {
  margin-top: 18px; width: 100%; height: 60px; border: 0; border-radius: 999px;
  font-size: 20px; font-weight: 800; color: #fff;
  background: linear-gradient(180deg, #ffb347, #ff7b54); box-shadow: 0 6px 0 #d9572f;
}
.ov-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #d9572f; }

/* =========================================================
   スタンプを押したときの「ごほうびタイム」
   ========================================================= */
.show-layer {
  position: fixed; inset: 0; z-index: 25; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.show-layer.show { opacity: 1; pointer-events: auto; }
.show-layer.night { --ray: rgba(255,210,63,.22); --txt: #ffe27a; --txt2: #fff; }
.show-layer.pink  { --ray: rgba(255,255,255,.6);  --txt: #ff3d7f; --txt2: #c2456f; }
.show-bg { position: absolute; inset: 0; transition: opacity .5s; }
.show-layer.night .show-bg { background: radial-gradient(circle at 50% 45%, rgba(110,70,220,.94), rgba(20,10,60,.97) 70%); }
.show-layer.pink  .show-bg { background: radial-gradient(circle at 50% 45%, rgba(255,228,240,.96), rgba(255,170,200,.97) 75%); }
.show-rays {
  position: absolute; left: 50%; top: 50%; width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax;
  border-radius: 50%; transition: opacity .5s;
  background: repeating-conic-gradient(var(--ray) 0 10deg, transparent 10deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 0, transparent 60%);
          mask: radial-gradient(circle, #000 0, transparent 60%);
  animation: spin 14s linear infinite;
}
.show-count, .show-praise, .show-hint { position: relative; font-weight: 800; text-align: center; transition: opacity .4s; }
.show-count { font-size: 30px; color: var(--txt2); }
.show-praise { font-size: 46px; color: var(--txt); text-shadow: 0 4px 0 rgba(0,0,0,.1); }
.show-layer.night .show-praise { text-shadow: 0 0 18px rgba(255,210,63,.7); }
.show-hint {
  position: absolute; bottom: calc(env(safe-area-inset-bottom) + 36px);
  font-size: 15px; color: var(--txt2); opacity: .85; animation: bounce 1.2s ease-in-out infinite;
}
.show-layer.show .show-count  { animation: dropIn .6s .15s cubic-bezier(.3,1.6,.5,1) both; }
.show-layer.show .show-praise { animation: dropIn .6s .9s cubic-bezier(.3,1.6,.5,1) both, wobble 1.2s 1.6s ease-in-out infinite; }
@keyframes dropIn { from { transform: translateY(-30px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-5deg) scale(1.06); } 75% { transform: rotate(5deg) scale(1.06); } }
/* 帰るときは背景と文字だけ消して、スタンプはカードへ飛んでいく */
.show-layer.leaving .show-bg, .show-layer.leaving .show-rays,
.show-layer.leaving .show-count, .show-layer.leaving .show-praise, .show-layer.leaving .show-hint { opacity: 0; }

.show-fly { position: relative; width: min(58vw, 230px); aspect-ratio: 1; }
.show-fly .stamp { inset: 0; }
.show-fly .stamp svg { width: 54%; }
.show-fly .stamp-text { font-size: clamp(14px, 4.6vw, 20px); }
.show-fly .stamp::before { font-size: 26px; }
.show-layer.show .show-fly .stamp { animation: bigIn .8s cubic-bezier(.3,1.5,.5,1) both, breathe 1.4s .8s ease-in-out infinite; }
.show-layer.leaving .show-fly .stamp { animation: none; }
@keyframes bigIn { from { transform: scale(0) rotate(calc(var(--r) - 540deg)); } to { transform: scale(1) rotate(var(--r)); } }
@keyframes breathe { 0%,100% { transform: scale(1) rotate(var(--r)); } 50% { transform: scale(1.06) rotate(var(--r)); } }

.walk-paw { position: absolute; font-size: 34px; animation: pawStep 1.4s ease-out forwards; }
@keyframes pawStep {
  0% { opacity: 0; transform: scale(.3) rotate(var(--rot)); }
  20% { opacity: 1; transform: scale(1.15) rotate(var(--rot)); }
  70% { opacity: .9; transform: scale(1) rotate(var(--rot)); }
  100% { opacity: 0; transform: scale(1) rotate(var(--rot)); }
}

/* =========================================================
   おとなメニュー（タイトル長押しで開く）
   ========================================================= */
h1 { transition: transform .2s; }
h1.holding { transform: scale(.88); transition: transform 1.9s linear; }
.panel h3 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.panel small { font-size: 13px; opacity: .7; }
.menu-btn {
  display: block; width: 100%; height: 52px; margin-top: 10px; border: 0; border-radius: 16px;
  font-size: 16px; font-weight: 800; background: #f3eefb; color: #4a2196;
}
.menu-btn.danger { background: #ffe3ea; color: #d93d75; }
.menu-btn.cancel { background: none; color: #999; }

/* 紙吹雪用キャンバス（タップは下に通す） */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; }
</style>
</head>
<body>

<div class="bg bg-night" id="bgNight"><div class="moon"></div><div class="shooting"></div></div>
<div class="bg bg-pink" id="bgPink"></div>

<nav class="tabs" id="tabs">
  <span class="tab-indicator"></span>
  <button data-go="0" class="active">🪔 アラジン</button>
  <button data-go="1">🐱 ねこふんじゃった</button>
</nav>

<main class="pages" id="pages"></main>

<div class="overlay" id="overlay">
  <div class="panel">
    <div class="medal">🏅</div>
    <h2>おめでとう！</h2>
    <p id="ovText"></p>
    <button class="ov-btn" id="ovBtn">やったね！</button>
  </div>
</div>

<div class="show-layer" id="show">
  <div class="show-bg"></div>
  <div class="show-rays"></div>
  <div class="show-count" id="showCount"></div>
  <div class="show-fly" id="showFly"></div>
  <div class="show-praise" id="showPraise"></div>
  <div class="show-hint">がめんを タップして キラキラ！</div>
</div>

<div class="overlay" id="menuOv">
  <div class="panel">
    <h3>🔧 おとなメニュー</h3>
    <p id="menuText"></p>
    <button class="menu-btn" data-act="stamps">いまのカードの スタンプを消す</button>
    <button class="menu-btn danger" data-act="all">クリア回数も ふくめて ぜんぶ消す</button>
    <button class="menu-btn cancel" data-act="cancel">やめる</button>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
/* =========================================================
   設定
   ========================================================= */
const CHILD_NAME = "";   // 例: "はなこ" と入れると「はなこちゃんの ピアノカード」になる
const GOAL = 5;          // 何回でゴールか
const STORAGE_KEY = "piano-stamp-card-v1";

/* スタンプの絵（SVG）。外部画像を使わないのでファイル1つで完結する */
const LAMP_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <g fill="#ffd23f" stroke="#c98a00" stroke-width="2" stroke-linejoin="round">
    <circle cx="50" cy="31" r="5"/>
    <path d="M36 50 Q50 33 64 50 Z"/>
    <path d="M20 54 Q50 43 78 54 Q86 54 96 41 Q94 58 80 66 Q70 77 50 77 Q30 77 23 66 Q19 61 20 54 Z"/>
    <path d="M39 77 L61 77 L66 86 L34 86 Z"/>
  </g>
  <path d="M21 57 Q6 55 9 66 Q12 74 25 68" fill="none" stroke="#ffd23f" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="38" cy="60" rx="9" ry="3.5" fill="#fff" opacity=".55"/>
  <path d="M86 18 l2.5 6.5 6.5 2.5 -6.5 2.5 -2.5 6.5 -2.5 -6.5 -6.5 -2.5 6.5 -2.5z" fill="#fff6c4"/>
</svg>`;

const CAT_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <g fill="#fff"><path d="M19 46 L23 13 L45 30 Z"/><path d="M81 46 L77 13 L55 30 Z"/><ellipse cx="50" cy="56" rx="32" ry="27"/></g>
  <path d="M25 38 L26 22 L37 31 Z" fill="#ffb3cc"/><path d="M75 38 L74 22 L63 31 Z" fill="#ffb3cc"/>
  <g fill="none" stroke="#ff5c93" stroke-width="4" stroke-linecap="round">
    <path d="M33 54 Q38 47 43 54"/><path d="M57 54 Q62 47 67 54"/>
    <path d="M43 66 Q46.5 70 50 66 Q53.5 70 57 66"/>
  </g>
  <path d="M46.5 60.5 L53.5 60.5 L50 64 Z" fill="#ff5c93"/>
  <circle cx="30" cy="63" r="4.5" fill="#ffb3cc"/><circle cx="70" cy="63" r="4.5" fill="#ffb3cc"/>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M4 56 L20 58 M5 66 L20 63 M96 56 L80 58 M95 66 L80 63"/></g>
</svg>`;

/* カードの定義。ここに足せば曲を増やせる */
const CARDS = [
  { id: "aladdin", title: "アラジン", icon: "🪔", theme: "night", svg: LAMP_SVG,
    emojis: ["✨", "⭐", "🌟", "💫"], colors: ["#ffd23f", "#ffe9a8", "#b28dff", "#8a5ff0", "#ffffff"] },
  { id: "neko", title: "ねこふんじゃった", icon: "🐱", theme: "pink", svg: CAT_SVG,
    emojis: ["🐾", "💖", "🎵", "🌸"], colors: ["#ff5c93", "#ffb3cc", "#ffd166", "#9be7ff", "#ffffff"] },
];

/* =========================================================
   データの保存（localStorage）
   JSONに変換して1つのキーにまとめて保存している
   ========================================================= */
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}
const state = loadState();
for (const c of CARDS) state[c.id] ??= { stamps: [], cleared: 0 };
// 「このデータは消さないで」とブラウザにお願いする（対応ブラウザのみ）
navigator.storage?.persist?.();

/* =========================================================
   小さな道具
   ========================================================= */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmtDate = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };

/* =========================================================
   画面をつくる
   ========================================================= */
const pagesEl = document.getElementById("pages");
const els = {};

for (const c of CARDS) {
  const page = document.createElement("section");
  page.className = `page ${c.theme}`;
  page.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div class="sub">${CHILD_NAME ? CHILD_NAME + "ちゃんの " : ""}ピアノ スタンプカード</div>
        <h1><span class="head-icon">${c.icon}</span>${c.title}</h1>
        <div class="medals"></div>
      </div>
      <div class="grid"></div>
      <p class="msg"></p>
    </div>
    <div class="actions">
      <button class="play"></button>
      <button class="undo">ひとつ もどす</button>
    </div>`;
  pagesEl.appendChild(page);
  els[c.id] = {
    page, card: page.querySelector(".card"), grid: page.querySelector(".grid"),
    msg: page.querySelector(".msg"), medals: page.querySelector(".medals"),
    play: page.querySelector(".play"), undo: page.querySelector(".undo"),
  };
  els[c.id].play.addEventListener("click", () => onPlay(c));
  els[c.id].undo.addEventListener("click", () => onUndo(c));
  setupHold(c);
  render(c);
}

/* 状態(state) → 見た目 を毎回つくり直す。
   「データが正、画面はその写し」にしておくとバグりにくい */
function render(c, { land = -1, pop = false, pending = -1 } = {}) {
  const s = state[c.id], e = els[c.id];
  // pending: 保存は済んでいるが、まだカードに着地していないスタンプの番号
  const n = pending >= 0 ? pending : s.stamps.length;
  // 最後の1個を押した瞬間は、まだゴールを開けない（演出で開ける）
  const done = n >= GOAL && land !== GOAL - 1;

  let html = "";
  for (let i = 0; i < GOAL; i++) {
    const st = i < n ? s.stamps[i] : null;
    const cls = ["slot", st && "filled", i === n && "next", pop && "pop", i === land && "landing"].filter(Boolean).join(" ");
    html += `<div class="${cls}" style="--i:${i}" data-i="${i}">`;
    html += st
      ? `<div class="stamp ${i === land ? "land" : ""}" style="--r:${st.r}deg">${c.svg}<span class="stamp-text">よくできました</span></div><span class="date">${fmtDate(st.t)}</span>`
      : `<span class="num">${i + 1}</span>`;
    html += `</div>`;
  }
  html += `<div class="goal ${done ? "done" : ""} ${pop ? "pop" : ""}" style="--i:${GOAL}">
             <span class="gift">${done ? "🏆" : "🎁"}</span><span class="glabel">${done ? "ゴール！" : "ゴール"}</span></div>`;
  e.grid.innerHTML = html;

  e.msg.textContent =
    n === 0 ? "ひいたら ボタンを おしてね 🎹" :
    n < GOAL ? `あと ${GOAL - n}かい で ゴール！` :
    "ゴール！ よく がんばったね！";
  e.play.textContent = n >= GOAL ? "🎁 あたらしい カードに する" : "🎹 1かい ひいたよ！";
  e.medals.textContent = s.cleared > 0
    ? `クリア ${"🏅".repeat(Math.min(s.cleared, 5))}${s.cleared > 5 ? ` ×${s.cleared}` : ""}` : "";
  e.undo.classList.toggle("hidden", n === 0);
}

/* =========================================================
   ボタンを押したとき
   ========================================================= */
let busy = false;   // 演出中の連打を防ぐ

async function onPlay(c) {
  if (busy) return;
  const s = state[c.id];
  if (s.stamps.length >= GOAL) return newCard(c);

  busy = true;
  s.stamps.push({ t: Date.now(), r: Math.round(rand(-14, 14)) });
  saveState();                         // 先に保存しておく（途中でアプリを閉じても消えない）
  const i = s.stamps.length - 1;
  render(c, { pending: i });

  await showStamp(c, i);               // ごほうびタイム（約4秒）が終わるまで待つ

  render(c, { land: i });
  sfx.stamp(i, 0.08);
  setTimeout(() => {                   // カードに着地した瞬間の演出
    const slot = els[c.id].grid.querySelector(`[data-i="${i}"]`);
    const ring = document.createElement("div");
    ring.className = "ring";
    slot.appendChild(ring);
    const card = els[c.id].card;
    card.classList.remove("thump"); void card.offsetWidth; card.classList.add("thump");
    const r = slot.getBoundingClientRect();
    fx.burst(r.left + r.width / 2, r.top + r.height / 2, c, 30, 8);
  }, 100);

  if (i === GOAL - 1) setTimeout(() => celebrate(c), 700);
  else setTimeout(() => (busy = false), 500);
}

/* =========================================================
   ごほうびタイム
   画面いっぱいに大きなスタンプ → メロディ → カードへ飛んでいく
   ========================================================= */
const PRAISE = ["すごい！", "じょうず！", "かっこいい！", "てんさい！", "ばっちり！", "がんばったね！", "ステキ！"];
const showEl = document.getElementById("show");
const showFly = document.getElementById("showFly");
let showCard = null;

function centerOf(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width };
}

function showStamp(c, i) {
  return new Promise(resolve => {
    const st = state[c.id].stamps[i];
    showCard = c;
    showEl.className = `show-layer ${c.theme}`;
    showFly.innerHTML = `<div class="stamp" style="--r:${st.r}deg">${c.svg}<span class="stamp-text">よくできました</span></div>`;
    document.getElementById("showCount").textContent = `${i + 1}かいめ！`;
    document.getElementById("showPraise").textContent = pick(PRAISE);
    void showEl.offsetWidth;           // リフローさせてからクラスを付けると、毎回アニメが最初から再生される
    showEl.classList.add("show");
    sfx.jingle(i);                     // タップ処理の中で鳴らし始める（iOSの音の制約）

    setTimeout(() => { const p = centerOf(showFly); fx.burst(p.x, p.y, c, 45, 11); }, 650);
    for (let k = 0; k < 7; k++) {      // スタンプのまわりでキラキラが順番にはじける
      setTimeout(() => {
        const p = centerOf(showFly), a = rand(0, Math.PI * 2), rad = p.w * 0.65;
        fx.burst(p.x + Math.cos(a) * rad, p.y + Math.sin(a) * rad, c, 7, 3.5);
      }, 950 + k * 320);
    }
    if (c.theme === "pink") pawWalk();
    else setTimeout(() => fx.rain(c, 60), 300);

    setTimeout(() => flyToCard(c, i, resolve), 3300);
  });
}

/* ねこカード：肉球がトコトコ歩いていく */
function pawWalk() {
  for (let k = 0; k < 9; k++) {
    setTimeout(() => {
      const p = document.createElement("span");
      p.className = "walk-paw";
      p.textContent = "🐾";
      const x = 10 + (k / 8) * (innerWidth - 60);
      const y = innerHeight * 0.76 + (k % 2 ? -22 : 22);
      p.style.cssText = `left:${x}px;top:${y}px;--rot:${80 + rand(-10, 10)}deg`;
      showEl.appendChild(p);
      sfx.step(k);
      setTimeout(() => p.remove(), 1500);
    }, 500 + k * 260);
  }
}

/* 大きいスタンプを、カードの枠の位置・大きさまで縮めながら飛ばす。
   「今の位置」と「行き先の位置」の差を計算して transform で動かす（FLIPという定番テクニック） */
function flyToCard(c, i, resolve) {
  const slot = els[c.id].grid.querySelector(`[data-i="${i}"]`);
  const from = centerOf(showFly), to = centerOf(slot);
  showEl.classList.add("leaving");
  sfx.whoosh();
  const anim = showFly.animate(
    [{ transform: "translate(0, 0) scale(1)" },
     { transform: `translate(${to.x - from.x}px, ${to.y - from.y}px) scale(${to.w / from.w})` }],
    { duration: 550, easing: "cubic-bezier(.55, 0, .75, .2)", fill: "forwards" });
  anim.onfinish = () => {
    showEl.classList.remove("show", "leaving");
    showFly.innerHTML = "";
    anim.cancel();
    showEl.querySelectorAll(".walk-paw").forEach(e => e.remove());
    resolve();
  };
}

/* ごほうびタイム中に画面をタップすると、そこでキラキラ＋音 */
showEl.addEventListener("pointerdown", e => {
  if (!showEl.classList.contains("show") || showEl.classList.contains("leaving")) return;
  fx.burst(e.clientX, e.clientY, showCard, 14, 6);
  sfx.sparkle();
});

/* =========================================================
   おとなメニュー：タイトルを2秒長押しで開く（子どもが偶然開かないように）
   ========================================================= */
const menuOv = document.getElementById("menuOv");
let menuCard = null;

function setupHold(c) {
  const h1 = els[c.id].page.querySelector("h1");
  let timer = null;
  h1.addEventListener("pointerdown", () => {
    h1.classList.add("holding");
    timer = setTimeout(() => { h1.classList.remove("holding"); openMenu(c); }, 2000);
  });
  const stop = () => { clearTimeout(timer); h1.classList.remove("holding"); };
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => h1.addEventListener(ev, stop));
}

function openMenu(c) {
  if (busy) return;
  menuCard = c;
  const s = state[c.id];
  menuOv.dataset.theme = c.theme;
  document.getElementById("menuText").innerHTML =
    `「${c.title}」の カードを どうする？<br><small>いま：スタンプ ${s.stamps.length}こ ／ クリア ${s.cleared}まい</small>`;
  menuOv.classList.add("show");
}

menuOv.addEventListener("click", e => {
  const act = e.target.dataset?.act;
  if (!act && e.target !== menuOv) return;   // パネルの余白タップは無視、背景タップは閉じる
  const s = state[menuCard.id];
  if (act === "stamps") s.stamps = [];
  if (act === "all") { s.stamps = []; s.cleared = 0; }
  if (act === "stamps" || act === "all") { saveState(); render(menuCard, { pop: true }); }
  menuOv.classList.remove("show");
});

function celebrate(c) {
  const goal = els[c.id].grid.querySelector(".goal");
  goal.classList.add("done", "unlock");
  goal.querySelector(".gift").textContent = "🏆";
  goal.querySelector(".glabel").textContent = "ゴール！";
  const r = goal.getBoundingClientRect();
  fx.burst(r.left + r.width / 2, r.top + r.height / 2, c, 60, 11);
  sfx.fanfare();
  setTimeout(() => {
    fx.rain(c);
    showOverlay(c);
    busy = false;
  }, 600);
}

function newCard(c) {
  const s = state[c.id];
  s.cleared++;
  s.stamps = [];
  saveState();
  render(c, { pop: true });
  sfx.arpeggio();
  busy = true;
  setTimeout(() => (busy = false), 700);
}

/* 「ひとつもどす」は2回タップで実行（子どもの誤タップ対策） */
let undoArm = null;
function onUndo(c) {
  if (busy) return;
  const btn = els[c.id].undo;
  if (undoArm !== c.id) {
    undoArm = c.id;
    btn.textContent = "もういちど おすと もどります";
    btn.classList.add("armed");
    clearTimeout(onUndo.timer);
    onUndo.timer = setTimeout(() => disarmUndo(c), 3000);
    return;
  }
  disarmUndo(c);
  state[c.id].stamps.pop();
  saveState();
  render(c);
}
function disarmUndo(c) {
  undoArm = null;
  els[c.id].undo.textContent = "ひとつ もどす";
  els[c.id].undo.classList.remove("armed");
}

/* =========================================================
   おめでとう画面
   ========================================================= */
const overlay = document.getElementById("overlay");
function showOverlay(c) {
  overlay.dataset.theme = c.theme;
  document.getElementById("ovText").innerHTML =
    `${c.title} を ${GOAL}かい<br>ひけたね！ すごい！<br>これで ${state[c.id].cleared + 1}まいめ クリア 🎉`;
  overlay.classList.add("show");
}
document.getElementById("ovBtn").addEventListener("click", () => {
  overlay.classList.remove("show");
  sfx.arpeggio();
});

/* =========================================================
   スワイプ／タブ切り替え
   スクロール位置 p (0〜1) を使って背景とタブを連動させる
   ========================================================= */
const bgPink = document.getElementById("bgPink");
const tabs = document.getElementById("tabs");
const tabBtns = [...tabs.querySelectorAll("button")];

pagesEl.addEventListener("scroll", () => {
  const p = pagesEl.scrollLeft / pagesEl.clientWidth;
  bgPink.style.opacity = p;
  tabs.style.setProperty("--p", p);
  const idx = Math.round(p);
  tabBtns.forEach((b, i) => b.classList.toggle("active", i === idx));
  clearTimeout(pagesEl.saveTimer);
  pagesEl.saveTimer = setTimeout(() => { state._page = idx; saveState(); }, 300);
}, { passive: true });

tabBtns.forEach(b => b.addEventListener("click", () => {
  pagesEl.scrollTo({ left: Number(b.dataset.go) * pagesEl.clientWidth, behavior: "smooth" });
}));

// 前回見ていたカードを開く
requestAnimationFrame(() => {
  pagesEl.scrollLeft = (state._page || 0) * pagesEl.clientWidth;
});

/* 背景の星と肉球 */
const bgNight = document.getElementById("bgNight");
for (let i = 0; i < 60; i++) {
  const s = document.createElement("i");
  s.className = "star";
  s.style.cssText = `left:${rand(0, 100)}%;top:${rand(0, 100)}%;--s:${rand(1, 3.2)}px;animation-duration:${rand(2, 5)}s;animation-delay:${rand(-5, 0)}s`;
  bgNight.appendChild(s);
}
for (let i = 0; i < 14; i++) {
  const p = document.createElement("span");
  p.className = "paw";
  p.textContent = "🐾";
  const dur = rand(12, 22);
  p.style.cssText = `left:${rand(0, 95)}%;font-size:${rand(18, 36)}px;--rot:${rand(-30, 30)}deg;animation-duration:${dur}s;animation-delay:${-rand(0, dur)}s`;
  bgPink.appendChild(p);
}

/* iOSで :active（押し込みの見た目）を効かせるおまじない */
document.addEventListener("touchstart", () => {}, { passive: true });

/* =========================================================
   パーティクル（紙吹雪・キラキラ）を canvas で描く
   DOM要素を何百個も作るより、canvas に毎フレーム描く方が軽い
   ========================================================= */
const fx = (() => {
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, parts = [], running = false, last = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener("resize", resize);

  function make(x, y, vx, vy, c, opt = {}) {
    const emoji = Math.random() < (opt.emojiRate ?? 0.4);
    return {
      x, y, vx, vy, g: opt.g ?? 0.28, drag: opt.drag ?? 0.985,
      rot: rand(0, Math.PI * 2), vr: rand(-0.25, 0.25),
      life: 0, max: opt.max ?? rand(55, 90), sway: rand(0, 6.28), swayAmp: opt.swayAmp ?? 0,
      emoji, char: pick(c.emojis), color: pick(c.colors),
      size: emoji ? rand(16, 28) : rand(7, 13),
    };
  }

  function burst(x, y, c, count = 30, power = 8) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(power * 0.35, power);
      parts.push(make(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 3, c));
    }
    start();
  }

  function rain(c, count = 170) {
    for (let i = 0; i < count; i++) {
      parts.push(make(rand(0, W), rand(-H * 0.8, -20), rand(-1, 1), rand(2, 5), c,
        { g: 0.04, drag: 0.995, max: 400, swayAmp: 1.2, emojiRate: 0.25 }));
    }
    start();
  }

  function start() {
    if (running) return;
    running = true; last = performance.now();
    requestAnimationFrame(tick);
  }

  function tick(now) {
    // dt: 60fps基準で何フレーム分経ったか。120HzのiPhoneでも同じ速さになる
    const dt = Math.min((now - last) / 16.67, 3); last = now;
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.life < p.max && p.y < H + 60);
    for (const p of parts) {
      p.vx *= Math.pow(p.drag, dt); p.vy = p.vy * Math.pow(p.drag, dt) + p.g * dt;
      p.x += (p.vx + Math.sin(p.life * 0.06 + p.sway) * p.swayAmp) * dt;
      p.y += p.vy * dt; p.rot += p.vr * dt; p.life += dt;
      const t = p.life / p.max;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - t * t);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.emoji) {
        ctx.font = `${p.size}px "Apple Color Emoji", sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(p.char, 0, 0);
      } else {
        ctx.scale(1, Math.cos(p.life * 0.25));   // ひらひら裏返る
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      }
      ctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, W, H); }
  }

  return { burst, rain };
})();

/* =========================================================
   効果音（Web Audio APIで音をその場で合成。音声ファイル不要）
   iOSは「ユーザーがタップした瞬間」でないと音を出せないので、
   タップの処理の中で AudioContext を作る/再開する
   ========================================================= */
const sfx = (() => {
  let ac = null;
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0];   // ド レ ミ ソ ラ（1個ごとに音が上がる）

  function ctx() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, at, dur, type = "triangle", vol = 0.22) {
    const a = ctx(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.01);   // 一瞬で立ち上がって
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur); // ゆっくり減衰 → ピアノっぽい
    o.connect(g).connect(a.destination);
    o.start(at); o.stop(at + dur + 0.05);
  }
  function piano(freq, at, dur = 1) {
    tone(freq, at, dur, "triangle", 0.22);
    tone(freq * 2, at, dur * 0.5, "sine", 0.05);   // 倍音を少し足す
  }
  function thump(at) {   // スタンプの「ポン」
    const a = ctx(), o = a.createOscillator(), g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(220, at);
    o.frequency.exponentialRampToValueAtTime(60, at + 0.15);
    g.gain.setValueAtTime(0.5, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.2);
    o.connect(g).connect(a.destination);
    o.start(at); o.stop(at + 0.25);
  }
  // 1回ごとにちがう、短いオリジナルのメロディ（ドレミソラだけで作ると明るく聞こえる）
  const JINGLES = [
    [392, 523.25, 659.25, 783.99, 659.25, 783.99, 1046.5],
    [523.25, 587.33, 659.25, 783.99, 880, 783.99, 1046.5],
    [659.25, 783.99, 880, 783.99, 659.25, 783.99, 1046.5, 1174.66],
    [783.99, 659.25, 523.25, 659.25, 783.99, 880, 1046.5, 1318.5],
    [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5, 1567.98],
  ];
  const HIGH = [1046.5, 1174.66, 1318.5, 1567.98, 1760, 2093];
  return {
    jingle(i) {
      const t = ctx().currentTime + 0.05;
      const mel = JINGLES[i % JINGLES.length];
      mel.forEach((f, k) => piano(f, t + k * 0.15, k === mel.length - 1 ? 1.5 : 0.5));
      piano(130.81, t, 1.6);                         // 低い「ド」で支える
      piano(196, t + mel.length * 0.15 - 0.15, 1.6); // 最後に低い「ソ」
    },
    sparkle() {
      const t = ctx().currentTime;
      const f = pick(HIGH);
      tone(f, t, 0.35, "sine", 0.12);
      tone(f * 1.5, t + 0.05, 0.25, "sine", 0.04);
    },
    step(k) {
      const t = ctx().currentTime;
      tone(1200 + (k % 2) * 200, t, 0.1, "sine", 0.06);
    },
    whoosh() {
      const a = ctx(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(400, t);
      o.frequency.exponentialRampToValueAtTime(1600, t + 0.4);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      o.connect(g).connect(a.destination);
      o.start(t); o.stop(t + 0.5);
    },
    stamp(i, delay) {
      const t = ctx().currentTime + delay;
      thump(t);
      piano(SCALE[i % SCALE.length], t + 0.02, 1.1);
      tone(2093, t + 0.1, 0.25, "sine", 0.06);       // キラッ
    },
    fanfare() {
      const t = ctx().currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, k) => piano(f, t + k * 0.13, 0.9));
      [523.25, 659.25, 783.99, 1046.5].forEach(f => piano(f, t + 0.6, 1.8));
    },
    arpeggio() {
      const t = ctx().currentTime;
      [783.99, 987.77, 1174.66].forEach((f, k) => piano(f, t + k * 0.08, 0.6));
    },
  };
})();
</script>
