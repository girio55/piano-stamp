<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ピアノ スタンプカード</title>
<!-- ホーム画面に追加したとき、全画面のアプリとして開くための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スタンプ">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<!-- ?v=… を変えると、iPhoneが古いキャッシュではなく新しいファイルを読みに行く -->
<link rel="stylesheet" href="app.css?v=5">
</head>
<body>
<script>
  // このページの設定。仕組みは app.js にまとめてある
  window.APP_CONFIG = {
    storageKey: "piano-stamp-card-v1",   // 保存データの名前（変えるとデータが見えなくなるので注意）
    childName: "",                        // 例: "はなこ" → 「はなこちゃんの ピアノ スタンプカード」
    goal: 5,                              // 何回でゴールか
    cards: ["aladdin", "neko"],           // 使う曲（app.js の CARD_LIB から選ぶ）
  };
</script>
<script src="app.js?v=5"></script>
</body>
</html>
