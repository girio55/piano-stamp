<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ひよりちゃんの ピアノすごろく</title>
<!-- ホーム画面に追加したとき、全画面のアプリとして開くための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ひより">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<!-- ?v=… を変えると、iPhoneが古いキャッシュではなく新しいファイルを読みに行く -->
<link rel="stylesheet" href="app.css?v=11">
</head>
<body>
<script>
  // このページの設定。仕組みは app.js にまとめてある
  window.APP_CONFIG = {
    // 名前をタップすると、この順番で こうたい する
    children: [
      { id: "hiyori", name: "ひよりちゃん",
        songs: ["aladdin", "neko", "risu", "kitsune"],          // 担当の曲（app.js の CARD_LIB から選ぶ）
        storageKey: "piano-sugoroku-hiyori-v3",                 // この子のデータの保存場所
        legacyKeys: ["piano-stamp-card-v1", "piano-stamp-card-yama-v1"] },   // 以前の保存場所（引き継ぎ用）
      { id: "miyabi", name: "みやびくん",
        songs: ["tulip", "sheep", "hige", "kirakira"],
        storageKey: "piano-sugoroku-miyabi-v3",
        legacyKeys: ["piano-stamp-card-tulip-v1", "piano-stamp-card-hoshi-v1"] },
    ],
    startChild: "hiyori",   // はじめて開いたときの子（あとは最後に選んだ子を覚えている）
    recitalDate: "2026-11-08",
  };
</script>
<script src="app.js?v=11"></script>
</body>
</html>
